[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadvision-pdc"
version = "0.1.0"
description = "CPU-GPU Accelerated Road Damage Detection Using Deep Learning (CS09645|11 PDC project)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RoadVision-PDC Team" }]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.0",
    "Pillow>=10.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "opencv-python-headless>=4.9",
    "pycocotools>=2.0.9",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
